pluginManagement {
    repositories {
        maven { name = 'Aliyun Public'; url = 'https://maven.aliyun.com/repository/public' }
        maven { name = 'Aliyun Gradle Plugin'; url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository { maven { name = 'Fabric'; url = uri('https://maven.fabricmc.net') } }
            filter { includeGroupAndSubgroups('net.fabricmc') }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'titanium-26.3'
includeBuild('build-logic')
include('common')
include('fabric')
include('neoforge')
