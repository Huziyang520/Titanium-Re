plugins {
    id 'java-library'
}

base {
    archivesName = "${mod_id}-${version}-${project.name}-${mc_range_label}"
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = ''
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.withType(Jar).configureEach {
    def license = ['LICENSE', 'LICENSE.md'].collect { rootProject.file(it) }.find { it.exists() }
    if (license != null) {
        from(license)
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': version,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version,
                'Automatic-Module-Name': mod_module_name
        ])
    }
}

processResources {
    filteringCharset = 'UTF-8'
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group,
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_minecraft_range'       : fabric_minecraft_range,
            'mc_range_label'               : mc_range_label,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_version_range'       : neoforge_version_range,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'mod_display_url'              : mod_display_url,
            'mod_issue_tracker_url'        : mod_issue_tracker_url,
            'mod_sources_url'              : mod_sources_url,
            'credits'                      : credits,
            'mod_module_name'              : mod_module_name,
            'titanium_version'             : project.findProperty('titanium_version') ?: '',
            'java_version'                 : java_version
    ]

    def jsonExpandProps = expandProps

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }
    inputs.properties(expandProps)
}
